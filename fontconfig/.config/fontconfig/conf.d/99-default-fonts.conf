<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ── Familia genérica sans-serif ──────────────────────────────── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- system-ui sigue igual que sans-serif -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── Serif: fuente real, no una sans ───────────────────────────── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- ── Monospace ─────────────────────────────────────────────────── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- ui-monospace apunta a monospace con prefer, no default -->
  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <!-- ── Emoji: fallback para texto normal (no monospace) ──────────── -->
  <match target="pattern">
    <test name="family" compare="not_eq"><string>monospace</string></test>
    <test name="family" compare="not_eq"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append_last">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ── CJK fallback global ───────────────────────────────────────── -->
  <match target="pattern">
    <edit name="family" mode="append_last">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

</fontconfig>
