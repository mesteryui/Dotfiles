<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ── Familia genérica sans-serif (interfaz) ──────────────────────── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- system-ui sigue igual que sans-serif -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── Serif: fuente real, no una sans ───────────────────────────── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- ── Monospace: la única fuente monoespaciada de la shell ───────── -->
  <!-- JetBrainsMono Nerd Font: expresiva (ligaduras + glifos Nerd Font),
       monoespaciada y sans. Noto Sans Mono queda solo como respaldo.    -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- ── CJK monoespaciado para las familias mono ────────────────────── -->
  <!-- Sin esto el CJK cae en Noto Sans CJK JP (proporcional) y rompe la
       alineación de columnas en la terminal.                             -->
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="append_last">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append_last">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrainsMono Nerd Font Mono</string></test>
    <edit name="family" mode="append_last">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- ── Emoji: única fuente que no es mono (inevitable) ─────────────── -->
  <!-- Noto Color Emoji si está instalada; Twemoji (monocromo) si no.     -->
  <match target="pattern">
    <edit name="family" mode="append_last">
      <string>Noto Color Emoji</string>
      <string>Twemoji</string>
    </edit>
  </match>

  <!-- ── CJK fallback global ───────────────────────────────────────── -->
  <match target="pattern">
    <edit name="family" mode="append_last">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

</fontconfig>
