# : Manager [[[

[mgr]
cwd = { fg = "#eddfe4" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff9465", bg = "#ff9465" }
marker_cut      = { fg = "#ffdbcb", bg = "#ffdbcb" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f4ba9e", bg = "#f4ba9e" }

# Count
count_copied   = { fg = "#311303", bg = "#ffdbcb" }
count_cut      = { fg = "#311303", bg = "#ffdbcb" }
count_selected = { fg = "#501e40", bg = "#f4ba9e" }

# Border
border_symbol = "│"
border_style  = { fg = "#f9b1db" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#f9b1db", bold = true, bg = "#181115" }
inactive  = { fg = "#debece", bg = "#181115" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#f9b1db", fg = "#501e40", bold = true }
normal_alt  = { bg = "#4f4349", fg = "#d3c2c9" }

# Select mode
select_main = { bg = "#debece", fg = "#3f2a36", bold = true }
select_alt  = { bg = "#4f4349", fg = "#d3c2c9" }

# Unset mode
unset_main = { bg = "#f4ba9e", fg = "#4b2714", bold = true }
unset_alt  = { bg = "#4f4349", fg = "#d3c2c9" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#aa5982" }
perm_write = { fg = "#e05a19" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff7132" }
perm_sep   = { fg = "#ff3fa1" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#f9b1db", bg = "#3f373b" }
progress_error  = { fg = "#ffb4ab", bg = "#3f373b" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3f373b" }
cand = { fg = "#f9b1db" }
rest = { fg = "#501e40" }
desc = { fg = "#eddfe4" }
separator = " ▶ "
separator_style = { fg = "#eddfe4" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#f4ba9e" }
title_warn  = { fg = "#f9b1db" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#f9b1db" }
active = { fg = "#f4ba9e", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#f9b1db" }
value  = { fg = "#eddfe4" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#f9b1db", bg = "#501e40" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#f9b1db" }
title   = {}
hovered = { fg = "#ffdbcb", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#eddfe4" }
run    = { fg = "#eddfe4" }
footer = { fg = "#3f2a36", bg = "#debece" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#eddfe4" },
    { url = "*/", fg = "#f9b1db" },
]
# : ]]]
[icon]
prepend_dirs = [
  { name = "Descargas", text = "" },
  { name = "Escritorio", text = ""},
  { name = "Música", text = "󰝚"},
  { name = "Documentos", text = ""},
  { name = "Vídeos", text = ""},
  { name = "Imágenes", text = "󰋹"}
]

