# : Manager [[[

[manager]
cwd = { fg = "#eddfe4" }

# Tab
tab_active = { fg = "#4f1e43", bg = "#f7b2df", bold = true }
tab_inactive = { fg = "#ffd7ee", bg = "#36072c" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ff9267", bg = "#ff9267" }
marker_cut = { fg = "#ffdbcd", bg = "#ffdbcd" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f5b9a1", bg = "#f5b9a1" }

# Count
count_copied = { fg = "#321204", bg = "#ffdbcd" }
count_cut = { fg = "#321204", bg = "#ffdbcd" }
count_selected = { fg = "#4f1e43", bg = "#f5b9a1" }

# Border
border_symbol = "│"
border_style  = { fg = "#f7b2df" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#4f1e43", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#f7b2df", fg = "#4f1e43", bold = true }
normal_alt  = { bg = "#4f444a", fg = "#d2c2ca" }

# Select mode
select_main = { bg = "#ddbecf", fg = "#3f2a37", bold = true }
select_alt  = { bg = "#4f444a", fg = "#d2c2ca" }

# Unset mode
unset_main = { bg = "#f5b9a1", fg = "#4b2716", bold = true }
unset_alt  = { bg = "#4f444a", fg = "#d2c2ca" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#f7b2df", bg = "#3f373b" }
progress_error = { fg = "#ffb4ab", bg = "#3f373b" }

# Permissions
permissions_t = { fg = "#a85a85" }
permissions_w = { fg = "#e55318" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#ff6d34" }
permissions_s = { fg = "#ff3ead" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#f7b2df" }
active = { fg = "#f5b9a1", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#f7b2df" }
value = { fg = "#eddfe4" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#f7b2df", bg = "#4f1e43" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#f7b2df" }
title = {}
hovered = { fg = "#ffdbcd", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3f373b" }
cand = { fg = "#f7b2df" }
rest = { fg = "#4f1e43" }
desc = { fg = "#eddfe4" }
separator = " ▶ "
separator_style = { fg = "#eddfe4" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#eddfe4" }
run = { fg = "#eddfe4" }
footer = { fg = "#3f2a37", bg = "#ddbecf" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#f5b9a1" }
title_warn = { fg = "#f7b2df" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#eddfe4" },
    { name = "*/", fg = "#f7b2df" },
]

# : ]]]