# Ryoku palette for yazi. Rendered by the theme daemon; do not edit.
#
# yazi reads theme.toml beside yazi.toml. Ryoku ships only yazi.toml, so this
# file is the daemon's alone and clobbers nothing you wrote.

[mgr]
cwd = { fg = "#e6bdbc" }

hovered = { fg = "#ffdad9", bg = "#733335" }
preview_hovered = { underline = true }

find_keyword = { fg = "#e5c18d", bold = true }
find_position = { fg = "#e6bdbc", bold = true }

marker_copied = { fg = "#e5c18d", bg = "#e5c18d" }
marker_cut = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked = { fg = "#e6bdbc", bg = "#e6bdbc" }
marker_selected = { fg = "#ffb3b3", bg = "#ffb3b3" }

tab_active = { fg = "#561d20", bg = "#ffb3b3" }
tab_inactive = { fg = "#d7c1c1", bg = "#271d1d" }

border_symbol = "│"
border_style = { fg = "#524343" }

[mode]
normal_main = { fg = "#561d20", bg = "#ffb3b3", bold = true }
normal_alt = { fg = "#ffb3b3", bg = "#271d1d" }
select_main = { fg = "#422c05", bg = "#e5c18d", bold = true }
select_alt = { fg = "#e5c18d", bg = "#271d1d" }
unset_main = { fg = "#690005", bg = "#ffb4ab", bold = true }
unset_alt = { fg = "#ffb4ab", bg = "#271d1d" }

[status]
progress_label = { fg = "#f0dede", bold = true }
progress_normal = { fg = "#ffb3b3", bg = "#271d1d" }
progress_error = { fg = "#ffb4ab", bg = "#271d1d" }

[input]
border = { fg = "#ffb3b3" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#ffb3b3" }
active = { fg = "#e5c18d", bold = true }
inactive = {}

[cmp]
border = { fg = "#ffb3b3" }
active = { fg = "#e5c18d", bold = true }
inactive = {}

[tasks]
border = { fg = "#ffb3b3" }
title = {}
hovered = { fg = "#e5c18d", underline = true }

[which]
mask = { bg = "#271d1d" }
cand = { fg = "#e6bdbc" }
rest = { fg = "#d7c1c1" }
desc = { fg = "#e5c18d" }
separator = "  "
separator_style = { fg = "#a08c8c" }

[help]
on = { fg = "#e6bdbc" }
run = { fg = "#e5c18d" }
hovered = { reversed = true, bold = true }
footer = { fg = "#f0dede", bg = "#271d1d" }

[notify]
title_info = { fg = "#ffb3b3" }
title_warn = { fg = "#e5c18d" }
title_error = { fg = "#ffb4ab" }

# the file list itself: dirs and file kinds carry the palette so yazi matches
# kitty's ANSI colours (base16), not yazi's built-in defaults. First match wins,
# so the "*" fallback stays last.
[filetype]
rules = [
	{ mime = "image/*", fg = "#733335" },
	{ mime = "{audio,video}/*", fg = "#8f4a4b" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "#e5c18d" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#e6bdbc" },
	{ url = "*/", fg = "#ffb3b3", bold = true },
	{ url = "*", fg = "#d7c1c1" },
]
