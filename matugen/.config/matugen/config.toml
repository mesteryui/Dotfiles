[config]

[templates.kvantum_kvconfig]
input_path = '/home/oscar/.config/matugen/templates/kvantum-colors.kvconfig'
output_path = '/home/oscar/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = '/home/oscar/.config/matugen/templates/kvantum-colors.svg'
output_path = '/home/oscar/.config/Kvantum/matugen/matugen.svg'

[templates.wlogout]
input_path = '/home/oscar/.config/matugen/templates/css_template.conf'
output_path = '/home/oscar/.config/wlogout/colors.css'

# [templates.materialhex]
# input_path = './templates/current_primary.txt'
# output_path = '~/.cache/matugen/current_primary_color.txt'
# post_hook = "./scripts/icon-reload.sh"

[templates.television]
input_path = '/home/oscar/.config/matugen/templates/television.toml'
output_path = '/home/oscar/.config/television/themes/matugen.toml'

[templates.walker]
input_path = './templates/css_template.conf'
output_path = '~/.config/walker/colors.css'

[templates.swayosd]
input_path = '~/.config/matugen/templates/css_template.conf'
output_path = '~/.config/swayosd/colors.css'
post_hook = '~/.config/hypr/scripts/restart_osd.sh'


[templates.bat]
input_path  = '/home/oscar/.config/matugen/templates/matugen-bat-colors.tmTheme'
output_path = '/home/oscar/.config/bat/themes/Matugen.tmTheme'
post_hook = 'bat cache --build'


[templates.kitty]
input_path = '/home/oscar/.config/matugen/templates/kitty-kolors.conf'
output_path = '/home/oscar/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR2 kitty'

[templates.ghostty]
input_path = './templates/ghostty.conf'
output_path = '~/.config/ghostty/themes/Matugen'
post_hook = 'pkill -SIGUSR2 ghostty'

[templates.waybar]
input_path = './templates/css_template.conf'
output_path = '~/.config/waybar/colors.css'
post_hook = 'launch-waybar'

[templates.nwgbar]
input_path = '/home/oscar/.config/matugen/templates/css_template.conf'
output_path = '/home/oscar/.config/nwg-bar/colors.css'

[templates.swaync]
input_path = '/home/oscar/.config/matugen/templates/css_template.conf'
output_path = '/home/oscar/.config/swaync/matugen/matugen-swaync.css'
post_hook = 'swaync-client -rs'

[templates.hyprland]
input_path = './templates/hyprland_template.conf'
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.kcolorscheme]
input_path = './templates/kcolorscheme.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'
post_hook = 'systemctl restart --user hyprpolkitagent'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.hyprtoolkit]
input_path = "/home/oscar/.config/matugen/templates/hyprland/hyprtoolkit.conf"
output_path = "/home/oscar/.config/hypr/hyprtoolkit.conf"
post_hook = "hyprctl reload"

[templates.vesktop]
input_path = './templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'

[templates.pywalfox]
input_path = './templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.qt5]
input_path = '/home/oscar/.config/matugen/templates/qtct-colors.conf'
output_path = '/home/oscar/.config/qt5ct/colors/matugen-qt5ct.conf'

[templates.starship]
input_path = "/home/oscar/.config/matugen/templates/matugen-starship.toml"
output_path = "/home/oscar/.config/starship.toml"

[templates.btop]
input_path = '/home/oscar/.config/matugen/templates/btop-theme'
output_path = '/home/oscar/.config/btop/themes/matugen.theme'

[templates.rofi]
input_path = '/home/oscar/.config/matugen/templates/matugen-rofi.rasi'
output_path = '/home/oscar/.config/rofi/matugen/matugen-rofi.rasi'

[templates.cava]
input_path = '/home/oscar/.config/matugen/templates/matugen-cava'
output_path = '/home/oscar/.dotfiles/cava/.config/cava/config'

[templates.fish]
input_path = '/home/oscar/.config/matugen/templates/fish_theme.fish'
output_path = '/home/oscar/.config/fish/themes/Matugen.theme'

[templates.zathura]
input_path = '/home/oscar/.config/matugen/templates/matugen-zathurarc'
output_path = '/home/oscar/.config/zathura/matugen-zathurarc'


[templates.yazi]
input_path = '/home/oscar/.config/matugen/templates/yazi-theme.toml'
output_path = '/home/oscar/.config/yazi/theme.toml'

[templates.spicetify]
input_path = '~/.config/matugen/templates/spotify-colors.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook = 'spicetify apply --no-restart'

