[config]
version_check = true

[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "center"]
set = true


[templates.gtk3]
input_path = '/home/oscar/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '/home/oscar/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'


[templates.vesktop]
input_path = 'templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'

# [templates.niri]
# input_path = '~/.config/matugen/templates/colors.kdl'
# output_path = '~/.config/niri/colors.kdl'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-kolors.conf'
output_path = '~/.config/kitty/colors.conf'
#post_hook = "kitty @ set-colors -a -c ~/.config/kitty/colors.conf"

[templates.waybar]
input_path = '~/.config/matugen/templates/css_template.conf'
output_path = '~/.config/waybar/colors.css'
post_hook = '~/.config/waybar/scripts/launch.sh'

[templates.nwgbar]
input_path = '~/.config/matugen/templates/css_template.conf'
output_path = '~/.config/nwg-bar/colors.css'
[templates.swaync]
input_path = '~/.config/matugen/templates/css_template.conf'
output_path = '~/.config/swaync/matugen/matugen-swaync.css'
post_hook = 'swaync-client -rs'

[templates.swayosd]
input_path = '~/.config/matugen/templates/css_template.conf'
output_path = '~/.config/swayosd/colors.css'
post_hook = '~/.config/hypr/scripts/restart_osd.sh'

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland_template.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.qt5]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen-qt5ct.conf'

[templates.starship]
input_path = "~/.config/matugen/templates/matugen-starship.toml"
output_path = "~/.config/starship.toml"

# Qt6
# [templates.qt6]
# input_path = '~/.config/matugen/templates/qtct-colors.conf'
# output_path = '~/.config/qt6ct/colors/matugen-qt6ct.conf'

[templates.color-scheme]
input_path = '~/.config/matugen/templates/Matugen.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.rofi]
input_path = '~/.config/matugen/templates/matugen-rofi.rasi'
output_path = '~/.config/rofi/matugen/matugen-rofi.rasi'


[templates.cava]
input_path = '~/.config/matugen/templates/matugen-cava'
output_path = '~/.dotfiles/cava/.config/cava/config'

[templates.fish]
input_path = '~/.config/matugen/templates/fish_theme.fish'
output_path = '~/.config/fish/themes/Matugen.theme'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.zathura]
input_path = '~/.config/matugen/templates/matugen-zathurarc'
output_path = '~/.config/zathura/matugen-zathurarc'

