[config]

# colors.json (the shell's own palette) is authored by the Go control plane;
# matugen fans that same palette into the core desktop surface below. These
# templates always render: the terminal, the Hyprland frame, the system
# monitor, and the Qt toolkit the shell itself is built on. The GTK / GUI-app
# fan-out lives in apps.toml, gated by the "Theme apps" toggle (theme.json
# themeApps), so a user can keep third-party apps stock while the shell tracks
# the palette.

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

# GTK 4 and GTK 3 read separate inputs: libadwaita 1.6+ recolours its widgets
# from CSS custom properties (:root) that GTK 3 cannot parse, so the GTK 4
# template leads with those and GTK 3 keeps the @define-color form it can read.
[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.hyprland]
input_path = './templates/hyprland_template.lua'
output_path = "~/.config/hypr/colors.lua"
post_hook = "hyprctl reload"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/ryoku.theme"

# The screen-share source chooser xdph launches. A core desktop surface, not a
# third-party app: it renders here so the chooser follows the wallpaper even
# with "Theme apps" off, instead of opening stock-grey in a themed session.
[templates.sharepicker]
input_path = "~/.config/matugen/templates/share-picker.css"
output_path = "~/.config/hyprland-preview-share-picker/style.css"

[templates.quickshell]
input_path = './templates/quickshell.json'
output_path = '~/.local/state/quickshell/generated/colors.json'


[templates.qt]
input_path = './templates/matugen.colors'
output_path = "~/.local/share/color-schemes/matugen.colors"

# fish/conf.d se auto-evalúa al arrancar la shell, así que el color de
# sintaxis y fzf sigue al wallpaper sin tocar tu config. Misma ruta que
# declara apps.toml para no duplicar salidas si algún día se usa ese fichero.
[templates.fish]
input_path = "~/.config/matugen/templates/colors.fish"
output_path = "~/.config/fish/conf.d/colors.fish"

# El prompt (starship se carga desde config.fish). La plantilla es el
# starship.toml completo: solo la paleta es dinámica, el diseño vive aquí.
[templates.starship]
input_path = "~/.config/matugen/templates/matugen-starship.toml"
output_path = "~/.config/starship.toml"

# Extensión Matugen Theme de VSCodium: vigila ~/.cache/matugen/vscode-colors*
# y regenera el tema "Matugen" al cambiar el wallpaper.
[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'
