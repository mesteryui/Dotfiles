source = ~/.config/hypr/colors.conf
$font = Google Sans Flex
$monofont = JetBrains Nerd Font Propo

general {
    no_fade_in = false
    no_fade_out = false
    grace = 1
    disable_loading = true
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor = 
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.8920
    vibrancy_darkness = 0.06
    brightness = 0.8160
}

# ---------------------------------------------------
# RELOJ Y FECHA (Centro Superior)
# Sin cambios: posiciones y colores ya son coherentes
# ---------------------------------------------------

label {
    text = <b>$TIME</b>
    color = $primary_fixed
    font_size = 180
    font_family = $font
    position = 0, 22%
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%A, %d de %B de %Y")"
    color = $primary_fixed
    font_size = 32
    font_family = $font
    position = 0, 10%
    halign = center
    valign = center
}

# ---------------------------------------------------
# PERFIL Y LOGIN (Centro)
# ---------------------------------------------------

image {
    monitor = 
    path = ~/.face
    size = 180
    rounding = -1
    border_color = $primary
    border_size = 5
    position = 0, -1%
    halign = center
    valign = center
    zindex = 1
}

label {
    text = $USER
    font_family = $font
    font_size = 28
    color = $on_background       # CAMBIO 1: faltaba color; heredaba blanco puro
    position = 0, -10%           # era -18%; sube 2% con el resto de elementos
    halign = center
    valign = center
}

input-field {
    monitor = 
    size = 20%, 65
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = $outline
    inner_color = $background
    font_family = $monofont
    font_color = $on_background
    check_color = $primary       # CAMBIO 3: feedback visual mientras verifica (MD3 primary)
    fail_color = $error          # CAMBIO 4: color de error MD3 en fallo de contraseña
    rounding = 20                # CAMBIO 5: esquinas redondeadas MD3 (shape token «large»)
    fade_on_empty = false
    placeholder_text = 󰌆 <i>Contraseña</i>
    hide_input = false
    position = 0, -18%           # era -27%; sube 2% con el resto de elementos
    halign = center
    valign = center
    zindex = 10
}

# ---------------------------------------------------
# BATERÍA (Esquina Superior Derecha)
# ---------------------------------------------------

shape {
    size = 6%, 70               # CAMBIO 7: era 60px; 70px da algo más de padding interior
    position = -2%, -2%
    rounding = -1
    color = $surface   # CAMBIO 8: era $surface; superficie elevada MD3
    halign = right
    valign = top
    zindex = 4
}

label {
    text = cmd[update:1000] echo -e "$(~/.config/hypr/scripts/battery-infolock.sh)"
    font_family = $monofont      # CAMBIO 9: era «font =»; usando font_family por consistencia
    font_size = 30
    position = -3%, -2.5%
    halign = right
    valign = top
    color = $on_surface
    zindex = 5
}

# ---------------------------------------------------
# REPRODUCTOR MULTIMEDIA (Centro Abajo)
# ---------------------------------------------------

shape {
    size = 35%, 170              # era 140px; más altura para más padding interior
    position = 0, 16%            # era 12%; sube 4% con el resto + compensa la mayor altura
    rounding = -1
    color = $surface   # CAMBIO 12: era $surface; superficie elevada MD3
    halign = center
    valign = bottom
    zindex = 4
}

label { # Título de la pista
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --title)"
    color = $on_surface
    font_size = 20
    font_family = $font
    position = 0, 22%            # era 16%; ajustado para el shape más alto y más arriba
    halign = center
    valign = bottom
    zindex = 5
}

label { # Anterior
    text = 󰒭
    font_family = $monofont      # CAMBIO 14: era «font =»
    font_size = 35
    position = -8%, 17%          # era 11%; ajustado al nuevo shape
    halign = center
    valign = bottom
    onclick = playerctl previous
    color = $on_surface
    zindex = 5
}

label { # Play/Pause
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --status)"
    font_family = $monofont      # CAMBIO 16: era «font =»
    font_size = 35
    position = 0, 17%
    halign = center
    valign = bottom
    onclick = playerctl play-pause
    color = $on_surface
    zindex = 5
}

label { # Siguiente
    text = 󰒮
    font_family = $monofont      # CAMBIO 17: era «font =»
    font_size = 35
    position = 8%, 17%
    halign = center
    valign = bottom
    onclick = playerctl next
    color = $on_surface
    zindex = 5
}

# ---------------------------------------------------
# SPLASH / MENSAJE (Borde Inferior)
# Sin cambios
# ---------------------------------------------------

label {
    text = cmd[update:0] echo "<i>$(hyprctl splash)</i>"
    color = $on_background
    font_size = 20
    font_family = $font
    italic = true
    position = 0, 5%
    halign = center
    valign = bottom
}
