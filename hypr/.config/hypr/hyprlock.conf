# ============================================
# HYPRLOCK - MATERIAL DESIGN 3
# ============================================
# Implementación de Material Design 3 (m3.material.io)
# Colores dinámicos, tipografía clara, movimiento sutil
# ============================================

source = $HOME/.config/hypr/colors.conf

# ============================================
# VARIABLES - Material Design 3
# ============================================
$font = "Google Sans Flex"
$font_bold = "Google Sans Flex Bold"
$font_medium = "Google Sans Flex Medium"
$font_semibold = "Google Sans Flex SemiBold"

# ============================================
# BACKGROUND - Material Surface
# ============================================
background {
    monitor =
    path = $image
    blur_passes = 4
    blur_size = 10
    contrast = 0.95
    brightness = 0.87
    vibrancy = 0.15
    vibrancy_darkness = 0.10
}

# ============================================
# GENERAL - Configuración base
# ============================================
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
}

# ============================================
# CONTAINER PRINCIPAL - Material Surface Container
# ============================================
shape {
    monitor =
    size = 420, 680
    color = $surface
    alpha = 0.95
    rounding = 32
    border_size = 1
    border_color = $outline_variant
    alpha_border = 0.20
    rotate = 0
    xray = false
    
    position = 0, 0
    halign = center
    valign = center
    
    shadow_passes = 3
    shadow_size = 20
    shadow_color = $shadow
    shadow_alpha = 0.12
}

# ============================================
# IMAGEN DE PERFIL - Material You Avatar
# ============================================
image {
    monitor =
    path = ~/.face
    border_size = 4
    border_color = $primary
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    
    position = 0, 70
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $shadow
    shadow_alpha = 0.08
}

# ============================================
# NOMBRE DE USUARIO - Label Large
# ============================================
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 16
    font_family = $font_medium
    
    position = 0, -20
    halign = center
    valign = center
}

# ============================================
# HORA - Display Large (Material Typescale)
# ============================================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $on_surface
    font_size = 92
    font_family = $font_bold
    
    position = 0, 240
    halign = center
    valign = center
}

# ============================================
# FECHA - Headline Small
# ============================================
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = $on_surface_variant
    font_size = 17
    font_family = $font_medium
    
    position = 0, -100
    halign = center
    valign = center
}

# ============================================
# HORA SECUNDARIA - Surface Lowest
# ============================================
shape {
    monitor =
    size = 220, 48
    color = $surface_container_lowest
    rounding = 24
    border_size = 0
    rotate = 0
    xray = false
    
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%p") • $(date +"%Z")"
    color = $on_surface_variant
    font_size = 14
    font_family = $font_medium
    
    position = 0, -150
    halign = center
    valign = center
}

# ============================================
# INFO MÚSICA - Body Medium
# ============================================
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/scripts/songdetail.sh)"
    color = $on_surface_variant
    font_size = 13
    font_family = $font
    
    position = 0, -210
    halign = center
    valign = center
}

# ============================================
# CAMPO DE CONTRASEÑA - Outlined Text Field
# ============================================
input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    
    # Puntos de indicador
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    
    # Colores Material Design 3
    outer_color = $outline
    inner_color = $surface_container_high
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary
    
    fade_on_empty = true
    fade_timeout = 3000
    
    # Tipografía
    font_family = $font
    font_size = 16
    placeholder_text = <i>🔒 Contraseña</i>
    
    hide_input = false
    rounding = 14
    
    position = 0, -290
    halign = center
    valign = center
    
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $shadow
    shadow_alpha = 0.06
}

# ============================================
# HINT - Body Small
# ============================================
label {
    monitor =
    text = Presiona Enter para desbloquear
    color = $on_surface_variant
    alpha = 0.70
    font_size = 12
    font_family = $font
    
    position = 0, 50
    halign = center
    valign = bottom
}

# ============================================
# INFO DEL SISTEMA - Label Small
# ============================================
label {
    monitor =
    text = cmd[update:60000] echo "󰌢 $(hostname) • $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'AC')%"
    color = $on_surface_variant
    font_size = 11
    font_family = $font
    
    position = 0, 16
    halign = center
    valign = bottom
}
