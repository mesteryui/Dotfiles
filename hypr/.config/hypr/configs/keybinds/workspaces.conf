# ~/.config/hypr/configs/keybinds/workspaces.conf

# ╔═════════════════════════════════════════════════════════════════════════════════════════════════╗
# ║                                 Gestión de espacios de trabajo                                  ║
# ╚═════════════════════════════════════════════════════════════════════════════════════════════════╝

# ---------------------------------------------------------------------------------------------------
# - Navegación entre espacios de trabajo
# ---------------------------------------------------------------------------------------------------
$ws = Workspaces
$d = [$ws|Navigation]
bindd = $mainMod, O, Abrir vista de espacios de trabajo, hyprexpo:expo, toggle
bindd = $mainMod, 1, $d Ir al espacio de trabajo 1, workspace, 1
bindd = $mainMod, 2, $d Ir al espacio de trabajo 2, workspace, 2
bindd = $mainMod, 3, $d Ir al espacio de trabajo 3, workspace, 3
bindd = $mainMod, 4, $d Ir al espacio de trabajo 4, workspace, 4
bindd = $mainMod, 5, $d Ir al espacio de trabajo 5, workspace, 5
bindd = $mainMod, 6, $d Ir al espacio de trabajo 6, workspace, 6
bindd = $mainMod, 7, $d Ir al espacio de trabajo 7, workspace, 7
bindd = $mainMod, 8, $d Ir al espacio de trabajo 8, workspace, 8
bindd = $mainMod, 9, $d Ir al espacio de trabajo 9, workspace, 9
bindd = $mainMod, 0, $d Ir al espacio de trabajo 10, workspace, 10

# ---------------------------------------------------------------------------------------------------
# - Mover ventanas a espacios de trabajo
# ---------------------------------------------------------------------------------------------------
bindd = $mainMod SHIFT, 1, Mover al espacio de trabajo 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Mover al espacio de trabajo 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Mover al espacio de trabajo 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Mover al espacio de trabajo 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Mover al espacio de trabajo 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Mover al espacio de trabajo 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Mover al espacio de trabajo 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Mover al espacio de trabajo 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Mover al espacio de trabajo 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Mover al espacio de trabajo 10, movetoworkspace, 10

# ---------------------------------------------------------------------------------------------------
# - Espacios de trabajo especiales (scratchpad)
# ---------------------------------------------------------------------------------------------------
bindd = $mainMod, S, Abrir espacio de trabajo especial, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Mover al espacio de trabajo especial, movetoworkspace, special:magic

# ---------------------------------------------------------------------------------------------------
# - Navegación relativa entre espacios de trabajo
# ---------------------------------------------------------------------------------------------------
$d = [$ws|Navigation|Relative workspace]
bindd = $mainMod Control, Right, $d Cambiar al siguiente espacio de trabajo, workspace, r+1
bindd = $mainMod Control, Left, $d Cambiar al espacio de trabajo anterior, workspace, r-1
