# ~/.config/hypr/configs/keybinds/windows.conf

# ╔═════════════════════════════════════════════════════════════════════════════════════════════════╗
# ║                                Gestión de ventanas y grupos                                     ║
# ╚═════════════════════════════════════════════════════════════════════════════════════════════════╝

# ---------------------------------------------------------------------------------------------------
# - Acciones básicas de ventanas
# ---------------------------------------------------------------------------------------------------
bindd = $mainMod Shift, Q, Cerrar aplicación activa, killactive,
bindd = $mainMod, V, Alternar ventana flotante, togglefloating,
bindd = $mainMod Shift, F, Activar o desactivar pantalla completa, fullscreen,
bindd = Alt, Tab, Cambiar entre ventanas, exec, walker -m windows
# Presiona Super + F12 para mostrar/ocultar
# Usamos un comando de shell para alternar el estado del plugin
bindd = $mainMod, F12, Alternar barra de titulo de ventanas, exec, hyprbars-toggle.sh
# ---------------------------------------------------------------------------------------------------
# - Movimiento del foco (estilo Vim y flechas)
# ---------------------------------------------------------------------------------------------------
bindd = $mainMod, h, Cambiar foco a izquierda (Vim), movefocus, l
bindd = $mainMod, l, Cambiar foco a derecha (Vim), movefocus, r
bindd = $mainMod, k, Cambiar foco hacia arriba (Vim), movefocus, u
bindd = $mainMod, j, Cambiar foco hacia abajo (Vim), movefocus, d

bindd = $mainMod, left, Cambiar foco a izquierda, movefocus, l
bindd = $mainMod, right, Cambiar foco a derecha, movefocus, r
bindd = $mainMod, up, Cambiar foco hacia arriba, movefocus, u
bindd = $mainMod, down, Cambiar foco hacia abajo, movefocus, d

# ---------------------------------------------------------------------------------------------------
# - Movimiento de ventanas (estilo Vim y flechas)
# ---------------------------------------------------------------------------------------------------
bindd = $mainMod Shift, h, Mover ventana a la izquierda (Vim), movewindow, l
bindd = $mainMod Shift, l, Mover ventana a la derecha (Vim), movewindow, r
bindd = $mainMod Shift, k, Mover ventana hacia arriba (Vim), movewindow, u
bindd = $mainMod Shift, j, Mover ventana hacia abajo (Vim), movewindow, d

bindd = $mainMod Shift, left, Mover ventana a la izquierda, movewindow, l
bindd = $mainMod Shift, right, Mover ventana a la derecha, movewindow, r
bindd = $mainMod Shift, up, Mover ventana hacia arriba, movewindow, u
bindd = $mainMod Shift, down, Mover ventana hacia abajo, movewindow, d

# ---------------------------------------------------------------------------------------------------
# - Redimensionamiento de ventanas (Submap)
# ---------------------------------------------------------------------------------------------------
bindd = ALT, R, Acceder al submapa de redimensionamiento, submap, resize

submap = resize
  $sr = ($sm resize)
  bindd = , escape, Salir del submapa, submap, reset
  binded = , l, $sr Aumentar a la izquierda (Vim), resizeactive, 10 0
  binded = , h, $sr Aumentar a la derecha (Vim), resizeactive, -10 0
  binded = , k, $sr Aumentar hacia abajo (Vim), resizeactive, 0 -10
  binded = , j, $sr Aumentar hacia arriba (Vim), resizeactive, 0 10

  binded = , right, $sr Aumentar a la izquierda, resizeactive, 10 0
  binded = , left, $sr Aumentar a la derecha, resizeactive, -10 0
  binded = , up, $sr Aumentar hacia abajo, resizeactive, 0 -10
  binded = , down, $sr Aumentar hacia arriba, resizeactive, 0 10
  bind = , catchall, submap, reset
submap = reset

# ---------------------------------------------------------------------------------------------------
# - Gestión de grupos de ventanas
# ---------------------------------------------------------------------------------------------------
bindd = ALT, G, Alternar agrupación de ventanas, togglegroup,
bindd = $mainMod ALT, G, Mover ventana activa fuera del grupo, moveoutofgroup,

bindd = $mainMod ALT, LEFT, Mover al grupo de la izquierda, moveintogroup, l
bindd = $mainMod ALT, RIGHT, Mover al grupo de la derecha, moveintogroup, r
bindd = $mainMod ALT, UP, Mover al grupo de arriba, moveintogroup, u
bindd = $mainMod ALT, DOWN, Mover al grupo de abajo, moveintogroup, d

bindd = $mainMod ALT, TAB, Siguiente ventana en el grupo, changegroupactive, f
bindd = $mainMod ALT SHIFT, TAB, Anterior ventana en el grupo, changegroupactive, b

bindd = $mainMod ALT, LEFT, Foco al grupo de la izquierda, changegroupactive, b
bindd = $mainMod ALT, RIGHT, Foco al grupo de la derecha, changegroupactive, f

bindd = $mainMod ALT, mouse_down, Siguiente ventana en el grupo (scroll), changegroupactive, f
bindd = $mainMod ALT, mouse_up, Anterior ventana en el grupo (scroll), changegroupactive, b

bindd = $mainMod ALT, code:10, Cambiar a ventana 1 del grupo, changegroupactive, 1
bindd = $mainMod ALT, code:11, Cambiar a ventana 2 del grupo, changegroupactive, 2
bindd = $mainMod ALT, code:12, Cambiar a ventana 3 del grupo, changegroupactive, 3
bindd = $mainMod ALT, code:13, Cambiar a ventana 4 del grupo, changegroupactive, 4
bindd = $mainMod ALT, code:14, Cambiar a ventana 5 del grupo, changegroupactive, 5
