source = ~/.config/hypr/configs/rules_windows/btop.conf
## Ventanas a espacios de trabajo
windowrule = workspace 5, class:^(vesktop)$
windowrule = workspace 4, class:^(gimp)$
windowrulev2 = pseudo, class:^(org.pwmt.zathura)$
windowrulev2 = float,class:^(mpv)$
# Browser Picture in Picture
source = ~/.config/hypr/configs/rules_windows/PictureInPicture.conf
windowrulev2 = float, title:^(Acerca.*)$
windowrulev2 = float, title:^(Watering)$
windowrule = float,class:^(blueberry.py)$
windowrule = float,class:^(nm-applet)$
windowrule = float,class:^(kvantummanager)$
windowrule = float,class:^(.*dialog.*)$
windowrule = float,class:^(org.localsend.localsend_app)$
#windowrulev2 = float,class:^(.*Loupe|.*Showtime|.*Cartridges)$
#windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$
#windowrule = size 35% 50%, class:xdg-desktop-portal-gtk

#windowrulev2 = float,class:waifudownloader

source = ~/.config/hypr/configs/rules_windows/jetbrains.conf
source = ~/.config/hypr/configs/rules_windows/terminals.conf

# FIxing Xwayland things
source = ~/.config/hypr/configs/rules_windows/someFixes.conf
source = ~/.config/hypr/configs/rules_windows/steam.conf


windowrule = float, tag:floating-term
windowrule = center, tag:floating-term
windowrule = size 800 700, tag:floating-term

windowrule = float, tag:floating-window
windowrule = center, tag:floating-window
windowrule = size 900 800, tag:floating-window

windowrule = tag +floating-term, class:(local.floating|float_kitty)
windowrulev2 = tag +floating-window, class:(xdg-desktop-portal-gtk|.*Loupe|.*Showtime|.*Cartridges|nwg-look|qt5ct|qt6ct|com.github.rafostar.Clapper|galculator|pavucontrol|waypaper|waifudownloader|catgirldownloader)$
