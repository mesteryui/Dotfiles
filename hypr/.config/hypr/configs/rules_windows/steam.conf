## Steam window rules
# Float Steam, fullscreen RetroArch
# --- REGLAS DE STEAM (BIBLIA HYPRLAND) ---

# 1. Regla Base: Se aplica a CUALQUIER ventana de la clase steam.
# Usamos 'name' para permitir control dinámico vía hyprctl.
windowrule {
    name = steam-base
    match:class = ^(steam)$
    float = on
    # La Wiki dicta: opacity es un producto. Usamos 'override' para forzar 100%
    opacity = 1.0 override 1.0 override 1.0 override
    # Efecto dinámico: inhibe el idle cuando la ventana tiene el foco
    idle_inhibit = focus
}

# 2. Ventana Principal: Propiedades específicas para el cliente.
windowrule {
    name = steam-main
    match:class = ^(steam)$
    match:title = ^(Steam)$
    size = 1100 700
    center = on
}

# 3. Lista de Amigos: Diferenciación por título.
windowrule {
    name = steam-friends
    match:class = ^(steam)$
    match:title = ^(Friends List)$
    size = 460 800
}

# 4. Modo Fullscreen (Juegos o Big Picture)
# La Wiki separa 'match:fullscreen' como un prop booleano.
windowrule {
    name = steam-fullscreen
    match:class = ^(steam)$
    match:fullscreen = true
    idle_inhibit = fullscreen
}
