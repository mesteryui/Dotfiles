# --- REGLA 1: Deshabilitar blur para ventanas sin clase ni título ---
# La Wiki indica que 'noblur' es un alias del efecto dinámico 'no_blur'.
windowrule {
    name = noblur-anonymous
    match:class = ^$
    match:title = ^$
    no_blur = on
}

# --- REGLA 2: Evitar foco en ventanas XWayland específicas ---
# Nota: La Wiki establece que todos los props deben coincidir. 
# Esta regla solo afectará a ventanas XWayland que estén flotando, no estén en fullscreen, 
# no estén pinned y no tengan clase/título.
windowrule {
    name = nofocus-xwayland-ghost
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = on
}

# --- REGLA 3: Suprimir evento de maximizado (Excepto Firefox) ---
# La Wiki explica que 'suppress_event' es un efecto estático.
# Usamos el prefijo 'negative:' para la negación de RegEx según la sección 'RegEx writing'.
windowrule {
    name = suppress-max-non-firefox
    match:class = negative:firefox
    suppress_event = maximize
}
