env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland 
env = CLUTTER_BACKEND, wayland
env = HYPRCURSOR_THEME,Bibata-Modern-Ice           # hyprcursor theme
env = HYPRCURSOR_SIZE,24                           # hyprcursor size
env = XCURSOR_THEME,Bibata-Modern-Ice              # xcursor theme
env = XCURSOR_SIZE,24                              # xcursor size
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
#env = DISPLAY, :0
env = WAYLAND_DISPLAY, wayland-0
env = DISPLAY, :0
env = MOZ_ENABLE_WAYLAND, 1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto # Electron things
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QUICK_CONTROLS_STYLE,org.hyprland.style
env = QT_WAYLAND_DISABLE_WINDOW_DECORATION, 1
env = GDK_SCALE, 2
env = GDK_DPI_SCALE, 0.5
env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11,**
