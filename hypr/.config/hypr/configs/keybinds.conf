$mainMod = SUPER
bind = $mainMod, I, hyprexpo:expo, toggle # Vision Panoramica espacios de trabajo
#bind = $mainMod, Z, easymotion, action:hyprctl dispatch focuswindow address:{}
bind = $mainMod, Return, exec, uwsm app -- $terminal # Abrir terminal
bind = $mainMod Shift, Q, killactive, # Cerrar aplicacion activa
bind = $mainMod Shift, E, exec, uwsm app -- wleave # Menu de apagado
bind = $mainMod, F, exec, uwsm app -- $fileManager # Gestor de archivos
bind = $mainMod, V, togglefloating, # Ventana a flotante
bind = $mainMod, D, exec, uwsm app -- vesktop # Cliente Discord
bind = $mainMod, G, exec, uwsm app -- cartridges # Cartuchos

bind = Alt, V, exec, uwsm app -- $menu -m clipboard # Menu portapapeles
bind = Alt , Space, exec, uwsm app -- $menu # Abrir menu general
bind = $mainMod , Space, exec, uwsm app -- $menu -m menus:main # Abrir menu sistema
bind = Alt, N, exec, uwsm app -- ~/.config/waybar/scripts/change_layout_uwsm.sh # Cambiar layout Wayland
bind = $mainMod, P, pseudo, # Pseudo Tiling
bind = $mainMod Alt, J, togglesplit, # Cambiar split
## Emacs Bindings
bind = $mainMod, E, exec, uwsm app -- $emacs # Ejecutar cliente emacs
## End of Emacs Bindings
bind = $mainMod, B, exec, uwsm app -- $browser
#bind = $mainMod, W, exec, uwsm app -- ~/.config/rofi/scripts/wallSelect.sh
bind = $mainMod, W, exec, uwsm app -- waypaper # Change wallpaper
#bind = Alt, E, exec, ~/.config/hypr/scripts/rofimoji.fish
bind = Alt, E, exec, walker -m symbols # Menu emojis
#bind = Alt, Tab, exec, ~/.config/rofi/scripts/window_change.sh
bind = Alt, Tab, exec, walker -m windows # Cambiar entre ventanas
#bind = Alt, Tab, cyclenext,
bind = Alt, C, exec, ~/.config/rofi/scripts/rofi-launcher-layout-pick.sh
bind = $mainMod, N, exec, uwsm app -- swaync-client -t -sw # Abrir panel notificaciones
bind = Shift, F11, fullscreen # Pantalla completa
# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
## Using normal binds
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# # Move windows # Commands in normal modes
bind = $mainMod Shift, h, movewindow, l
bind = $mainMod Shift, l, movewindow, r
bind = $mainMod Shift, k, movewindow, u
bind = $mainMod Shift, j, movewindow, d
## Using normal binds
bind = $mainMod Shift, left, movewindow, l
bind = $mainMod Shift, right, movewindow, r
bind = $mainMod Shift, up, movewindow, u
bind = $mainMod Shift, down, movewindow, d 

bind = $mainMod, R, exec, systemctl --user restart waybar
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Mover a espacio de trabajo 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Mover a espacio de trabajo 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Mover a espacio de trabajo 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Mover a espacio de trabajo 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Mover a espacio de trabajo 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Mover a espacio de trabajo 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Mover a espacio de trabajo 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Mover a espacio de trabajo 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Mover a espacio de trabajo 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Mover a espacio de trabajo 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic # Espacio trabajo especial
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
#bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
# Sink volume lower optionally with --device
#bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioLowerVolume, exec,swayosd-client --output-volume lower
#bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMute, exec,swayosd-client --output-volume mute-toggle
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
#bind = , F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#bind = , F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bind = , F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , Caps_Lock, exec, sleep 0.3 && swayosd-client --caps-lock
bindle = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindle = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindle = , Print, exec, hyprshot -m output -m eDP-1 # Capturar pantalla
bindle = Ctrl , Print, exec, walker -m menus:screenshot # Menu capturas
bindle = Alt, Print, exec, hyprshot -m output -m eDP-1 --clipboard-only
bindle = $mainMod, Print, exec, hyprshot -m region # Capturar region
bindle = $mainMod Shift, Print, exec, hyprshot -m region --clipboard-only # Copiar region

# $ws=Workspaces
# $d=[$ws|Navigation]
# bindd = $mainMod, 1, $d navigate to workspace 1 , workspace, 1
# bindd = $mainMod, 2, $d navigate to workspace 2 , workspace, 2
# bindd = $mainMod, 3, $d navigate to workspace 3 , workspace, 3
# bindd = $mainMod, 4, $d navigate to workspace 4 , workspace, 4
# bindd = $mainMod, 5, $d navigate to workspace 5 , workspace, 5
# bindd = $mainMod, 6, $d navigate to workspace 6 , workspace, 6
# bindd = $mainMod, 7, $d navigate to workspace 7 , workspace, 7
# bindd = $mainMod, 8, $d navigate to workspace 8 , workspace, 8
# bindd = $mainMod, 9, $d navigate to workspace 9 , workspace, 9
# bindd = $mainMod, 0, $d navigate to workspace 10 , workspace, 10

# Workspaces
bind = $mainMod, 1, workspace, 1  # Abrir espacio de trabajo 1
bind = $mainMod, 2, workspace, 2  # Abrir espacio de trabajo 2
bind = $mainMod, 3, workspace, 3  # Abrir espacio de trabajo 3
bind = $mainMod, 4, workspace, 4  # Abrir espacio de trabajo 4
bind = $mainMod, 5, workspace, 5  # Open workspace 5
bind = $mainMod, 6, workspace, 6  # Open workspace 6
bind = $mainMod, 7, workspace, 7  # Open workspace 7
bind = $mainMod, 8, workspace, 8  # Open workspace 8
bind = $mainMod, 9, workspace, 9  # Open workspace 9
bind = $mainMod, 0, workspace, 10 # Open workspace 10

$d=[$ws|Navigation|Relative workspace]
bindd = $mainMod Control, Right, $d change active workspace forwards  , workspace, r+1
bindd = $mainMod Control, Left, $d change active workspace backwards , workspace, r-1
## Submap for resizing

bind = ALT, R, submap, resize # Submap resize

submap = resize

bind = , escape, submap, reset # Salir del submapa resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
submap = reset

$d=#! unset the group name
