$mainMod = SUPER
# This will toggle HyprExpo when SUPER+g is pressed

bindd = SUPER, o, Vista global escritorio, hyprexpo:expo, toggle
bindd = $mainMod, Return, Abrir terminal , exec, uwsm app -- $terminal # Abrir terminal
bindd = $mainMod, F1, Activar o desactivar modo de juego, exec, toogle-gamemode.sh
bindd = $mainMod Shift, Q, Cerrar aplicación activa, killactive,
bindd = $mainMod Shift, E, Abrir menú de apagado, exec, uwsm app -- wleave
bindd = $mainMod, F, Abrir gestor de archivos, exec, uwsm app -- $fileManager
bindd = $mainMod, V, Alternar ventana flotante, togglefloating,
bindd = $mainMod, D, Abrir cliente Discord (Vesktop), exec, uwsm app -- vesktop
bindd = $mainMod, G, Abrir Cartuchos, exec, uwsm app -- cartridges

bindd = Alt, V, Abrir menú del portapapeles, exec, uwsm app -- $menu -m clipboard
bindd = $mainMod, K, Abrir menu de keybinds, exec, uwsm app -- menubinds.sh
bindd = Alt, Space, Abrir menú general, exec, uwsm app -- $menu
bindd = $mainMod, Space, Abrir menú del sistema, exec, uwsm app -- $menu -m menus:main
bindd = Alt, N, Cambiar layout de Waybar, exec, uwsm app -- $menu -m menus:waybar-layout-selector
bindd = $mainMod, P, Activar/desactivar Pseudo Tiling, pseudo,
bindd = $mainMod Alt, J, Cambiar tipo de división (split), togglesplit,
bindd = $mainMod, Z, Abrir Cliente Whatsapp,exec, uwsm app -- zapzap
## Emacs Bindings
bindd = $mainMod, E, Ejecutar cliente Emacs, exec, uwsm app -- $emacs

bindd = $mainMod, B, Abrir navegador, exec, uwsm app -- $browser
#bind = $mainMod, W, exec, uwsm app -- ~/.config/rofi/scripts/wallSelect.sh
bindd = $mainMod, W, Cambiar wallpaper, exec, uwsm app -- waypaper
#bind = Alt, E, exec, ~/.config/hypr/scripts/rofimoji.fish
bindd = Alt, E, Abrir menú de emojis, exec, walker -m symbols
#bind = Alt, Tab, exec, ~/.config/rofi/scripts/window_change.sh
bindd = Alt, Tab, Cambiar entre ventanas, exec, walker -m windows

#bind = Alt, Tab, cyclenext,
bindd = Alt, C, Alternar al modo no molestar, exec, swaync-client -d
bindd = $mainMod, N, Abrir panel de notificaciones, exec, uwsm app -- swaync-client -t -sw
bindd = $mainMod Shift, F , Activar o desactivar pantalla completa, fullscreen

# Mover foco con mainMod + teclas estilo Vim
bindd = $mainMod, h, Cambiar foco a izquierda (Vim), movefocus, l
bindd = $mainMod, l, Cambiar foco a derecha (Vim), movefocus, r
bindd = $mainMod, k, Cambiar foco hacia arriba (Vim), movefocus, u
bindd = $mainMod, j, Cambiar foco hacia abajo (Vim), movefocus, d

# Mover foco con mainMod + flechas
bindd = $mainMod, left, Cambiar foco a izquierda, movefocus, l
bindd = $mainMod, right, Cambiar foco a derecha, movefocus, r
bindd = $mainMod, up, Cambiar foco hacia arriba, movefocus, u
bindd = $mainMod, down, Cambiar foco hacia abajo, movefocus, d

# Mover ventana activa con mainMod + Shift + teclas estilo Vim



bindd = $mainMod, R,Reinciar Waybar, exec, systemctl --user restart waybar || systemctl --user start waybar # Reinciar waybar
# Move active window to a workspace with mainMod + SHIFT + [0-9]
# Mover la ventana activa a un espacio de trabajo (mainMod + SHIFT + número)
bindd = $mainMod SHIFT, 1, Mover a espacio de trabajo 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Mover a espacio de trabajo 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Mover a espacio de trabajo 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Mover a espacio de trabajo 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Mover a espacio de trabajo 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Mover a espacio de trabajo 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Mover a espacio de trabajo 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Mover a espacio de trabajo 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Mover a espacio de trabajo 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Mover a espacio de trabajo 10, movetoworkspace, 10


# Example special workspace (scratchpad)
bindd = $mainMod, S,Abrir espacio de trabajo especial, togglespecialworkspace, magic # Espacio trabajo especial
bindd = $mainMod SHIFT, S,Mover al espacio de trbajao especial, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, Mover ventana , movewindow
bindmd = $mainMod, mouse:273, Redimensionar ventana, resizewindow
#bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binded = , XF86AudioRaiseVolume, Subir volumen, exec, swayosd-client --output-volume raise
# Sink volume lower optionally with --device
#bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binded = , XF86AudioLowerVolume, Bajar volumen, exec, swayosd-client --output-volume lower
#bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindd = , XF86AudioMute, Silenciar audio, exec, swayosd-client --output-volume mute-toggle
bindd = , XF86AudioMicMute, Silenciar micrófono, exec, swayosd-client --input-volume mute-toggle

#bind = , F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binded = , XF86MonBrightnessUp, Subir brillo, exec, swayosd-client --brightness raise
binded = , XF86MonBrightnessDown, Bajar brillo , exec, swayosd-client --brightness lower
bindd = , Print, Capturar pantalla completa, exec, screenshoter
bindd = $mainMod, Print, Capturar pantalla completa, exec, screenshoter selection
bindd = Ctrl, Print, Abrir menú de capturas, exec, walker -m menus:screenshot
#bindd = $mainMod Shift, Print, Capturar región (copiar al portapapeles), bash -c "grim - | satty --filename - --output-filename $HYPRSHOT_DIR/satty-annotated-$(date +'%Y-%m-%d-%H%M%S').png --clipboard-only"
#bindd = Ctrl Shift, Print, Capturar con Satty(Anotaciones caputra), exec, 
#bindd = Alt, Print, Caputurar con Satty(Anotaciones caputra), exec, grim -g "$(slurp)" - | satty --filename - --output-filename $HYPRSHOT_DIR/satty-annotated-$(date +'%Y-%m-%d-%H%M%S').png


$ws=Workspaces
$d=[$ws|Navigation]
bindd = $mainMod, 1, $d navigate to workspace 1 , workspace, 1
bindd = $mainMod, 2, $d navigate to workspace 2 , workspace, 2
bindd = $mainMod, 3, $d navigate to workspace 3 , workspace, 3
bindd = $mainMod, 4, $d navigate to workspace 4 , workspace, 4
bindd = $mainMod, 5, $d navigate to workspace 5 , workspace, 5
bindd = $mainMod, 6, $d navigate to workspace 6 , workspace, 6
bindd = $mainMod, 7, $d navigate to workspace 7 , workspace, 7
bindd = $mainMod, 8, $d navigate to workspace 8 , workspace, 8
bindd = $mainMod, 9, $d navigate to workspace 9 , workspace, 9
bindd = $mainMod, 0, $d navigate to workspace 10 , workspace, 10


$d=[$ws|Navigation|Relative workspace]
bindd = $mainMod Control, Right, $d change active workspace forwards  , workspace, r+1
bindd = $mainMod Control, Left, $d change active workspace backwards , workspace, r-1
## Submap for resizing

bindd = ALT, R, Acceder al submap resize, submap, resize
$sm = Submap
$sp = ($sm Passthrough)

bindd = $mainMod, escape, Acceder al $sp, submap, Passthrough

submap = Passthrough
#bind = , catchall, submap, reset
bindd = , escape, Salir $sm, submap, reset
submap = reset

$smm = ($sm Multimedia)
bindd = $mainMod, I, $smm , submap, Multimedia
submap = Multimedia
bindd = , S, $smm Reproducir-Pausar,exec, playerctl play-pause
bindd = , P, $smm Anterior,exec, playerctl previous
bindd = , N, $smm Anterior,exec, playerctl next
bindd = , escape, $smm Salir, submap, reset
submap = reset
source = ~/.config/hypr/configs/keybinds/keybinds_tiling.conf

$sp=#!
$sr=#! unset the submap name
$d=#! unset the group name
