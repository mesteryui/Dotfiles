$active_border = $primary $tertiary 45deg
$inactive_border = $on_secondary $on_tertiary 45deg
general { 
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    resize_corner = 3
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = dwindle
}
dwindle {
    pseudotile = true
    force_split = 2
    preserve_split = true
    special_scale_factor = 0.8    
}
group {
    col.border_active = $active_border
    col.border_inactive = $inactive_border
    col.border_locked_active = -1
    col.border_locked_inactive = -1

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}
# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
   new_status = master
}
cursor {
    hide_on_key_press = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
    anr_missed_pings = 3
    new_window_takes_over_fullscreen = 1
    initial_workspace_tracking = 1
}
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 3
    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = false

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.1695
	popups = true
	ignore_opacity = on
	new_optimizations = true
	special = true
	xray = false
    }
    shadow {
	   enabled = true
	   range = 2
           render_power = 3
           color = $shadow
	}
}
render {
    direct_scanout = 0
}
xwayland {
  enabled = true
  force_zero_scaling = false
}

