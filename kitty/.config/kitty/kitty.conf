# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include colors.conf
# END_KITTY_THEME
font_family      JetBrainsMono NF Propo
bold_font        JetBrainsMono NFM Bold Propo
italic_font      JetBrainsMono NFM Italic Propo
bold_italic_font JetBrainsMono NFM Bold Italic Propo
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
font_size 9.0
window_padding_width 8
cursor_trail 1

symbol_map U+E000-U+F8FF Symbols Nerd Font

tab_bar_edge                bottom
font_size 11.5
cursor_shape beam
disable_ligatures never
background_opacity 0.9
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge                bottom
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
shell fish

[blur]
background=true
