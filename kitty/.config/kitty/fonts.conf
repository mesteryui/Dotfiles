# Única fuente de la shell: expresiva, monoespaciada y sans.
# JetBrainsMono Nerd Font (ttf-jetbrains-mono-nerd) ya incluye los glifos
# Nerd Font en el rango PUA, así que no hace falta ninguna symbol_map extra.
font_family      JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.3

# Ligaduras
disable_ligatures cursor
disable_ligatures never
